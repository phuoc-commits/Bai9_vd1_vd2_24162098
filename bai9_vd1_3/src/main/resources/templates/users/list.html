<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Users')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Users</h1><form method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm username/email"><button>Tìm</button></form><table><tr><th>Username</th><th>Email</th><th>Họ tên</th><th>Role</th><th>Số product</th></tr><tr th:each="u : ${users.content}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.role.name}"></td><td th:text="${u.products.size()}"></td></tr></table><div><a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}" th:href="@{/users(page=${i},keyword=${keyword})}" th:text="${i + 1}"></a></div></main></body></html>
