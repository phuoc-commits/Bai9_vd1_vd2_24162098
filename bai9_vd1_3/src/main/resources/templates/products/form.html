<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Product')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="auth-card"><h1>Thêm product</h1><form th:action="@{/products/save}" th:object="${productDTO}" method="post" enctype="multipart/form-data"><label>Tên</label><input th:field="*{name}" required><label>Mô tả</label><textarea th:field="*{description}"></textarea><label>Giá</label><input type="number" step="0.01" th:field="*{price}" required><label>User</label><select th:field="*{userId}"><option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option></select><label>Ảnh</label><input type="file" name="image" accept="image/*"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Lưu</button></form></main></body></html>
