<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Products')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Products</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><form method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm sản phẩm"><button>Tìm</button><a class="button" th:href="@{/products/new}">Thêm product</a></form><table><tr><th>Tên</th><th>Giá</th><th>User</th><th>Thao tác</th></tr><tr th:each="p : ${products.content}"><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.username}"></td><td><form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Xóa</button></form></td></tr></table><div><a th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:href="@{/products(page=${i},keyword=${keyword})}" th:text="${i + 1}"></a></div></main></body></html>
