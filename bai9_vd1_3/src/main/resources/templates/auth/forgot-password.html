<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head><body><main class="auth-card"><h1>Quên mật khẩu</h1><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post"><label>Email</label><input type="email" th:field="*{email}" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Gửi OTP</button></form><a th:href="@{/login}">Quay lại đăng nhập</a></main></body></html>
