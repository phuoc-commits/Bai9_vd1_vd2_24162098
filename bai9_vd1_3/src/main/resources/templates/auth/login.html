<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Đăng nhập</h1>
    <p th:if="${param.error}" style="color:red">Sai username/email hoặc mật khẩu.</p>
    <p th:if="${param.logout}" style="color:green">Bạn đã đăng xuất.</p>
    <form th:action="@{/login}" method="post">
        <label for="login">Username hoặc email</label>
        <input id="login" name="login" type="text" required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" required>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Đăng nhập</button>
    </form>
    <p><a th:href="@{/register}">Tạo tài khoản</a> | <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
</main>
</body>
</html>
