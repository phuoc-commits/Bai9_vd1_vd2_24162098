<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head><body><main class="auth-card"><h1>Đặt lại mật khẩu</h1><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><label>Email</label><input type="email" th:field="*{email}" required><label>OTP</label><input th:field="*{otp}" required><label>Mật khẩu mới</label><input type="password" th:field="*{password}" required><label>Nhập lại</label><input type="password" th:field="*{confirmPassword}" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Đổi mật khẩu</button></form></main></body></html>
