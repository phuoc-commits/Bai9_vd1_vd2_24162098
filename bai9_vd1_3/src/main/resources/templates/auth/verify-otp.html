<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head><body><main class="auth-card"><h1>Xác nhận OTP</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><label>Email</label><input type="email" th:field="*{email}"><label>Mã OTP</label><input th:field="*{otp}" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Xác nhận</button></form><form th:action="@{/resend-register-otp}" method="post"><input type="hidden" name="email" th:value="${verifyOtpDTO.email}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Gửi lại OTP</button></form></main></body></html>
