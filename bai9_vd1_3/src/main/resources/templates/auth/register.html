<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký')}"></head>
<body><main class="auth-card">
<h1>Đăng ký</h1><div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
<form th:action="@{/register}" th:object="${registerDTO}" method="post">
<label>Username</label><input th:field="*{username}"><small th:errors="*{username}"></small>
<label>Email</label><input type="email" th:field="*{email}"><small th:errors="*{email}"></small>
<label>Họ tên</label><input th:field="*{fullName}"><small th:errors="*{fullName}"></small>
<label>Mật khẩu</label><input type="password" th:field="*{password}"><small th:errors="*{password}"></small>
<label>Nhập lại mật khẩu</label><input type="password" th:field="*{confirmPassword}"><small th:errors="*{confirmPassword}"></small>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Đăng ký</button>
</form><a th:href="@{/login}">Đã có tài khoản?</a></main></body></html>
