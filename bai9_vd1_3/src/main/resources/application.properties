spring.application.name=bai9_vd1_3
server.port=8082
spring.config.import=optional:file:.env[.properties]

# Local H2 database. Set the SQL Server properties in .env when deploying.
spring.datasource.url=jdbc:h2:mem:login_demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.thymeleaf.cache=false

# SMTP. For Gmail, use an App Password, not the normal account password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary connection URL format: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
cloudinary.url=${CLOUDINARY_URL:cloudinary://key:secret@cloud}
