<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">
<main class="auth-shell">
<section class="auth-intro"><span class="eyebrow">IOTSTAR SHOP</span><h1>Chào mừng bạn trở lại.</h1><p>Đăng nhập để tiếp tục quản lý cửa hàng của bạn.</p></section>
<section class="auth-card"><div class="logo-mark">IS</div><h2>Đăng nhập</h2><p class="muted">Sử dụng email và mật khẩu của bạn.</p>
<div class="alert error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div><div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
<form th:action="@{/login}" method="post"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="phuoc2006@gmail.com" required autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary full" type="submit">Đăng nhập <span>→</span></button></form>
</section></main>
</body></html>
