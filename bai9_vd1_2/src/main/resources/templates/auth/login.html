<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Đăng nhập</title></head><body><main layout:fragment="content"><span class="eyebrow">UTE SHOP</span><h1>Chào mừng bạn trở lại.</h1><p>Đăng nhập bằng username hoặc email.</p><p class="alert" th:if="${param.error}" style="color:red">Sai username/email hoặc mật khẩu.</p><p class="alert" th:if="${param.logout}" style="color:green">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post"><label for="username">Username hoặc email</label><input id="username" name="username" type="text" placeholder="admin hoặc phuoc2006@gmail.com" required autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Đăng nhập →</button></form></main></body></html>
